<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=block" rel="stylesheet">
<style>html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;background:#F1E9DF}
text{font-family:'Nunito',sans-serif}</style></head><body>

 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C3CDD6"/><stop offset="1" stop-color="#97A5B2"/></linearGradient>
 <filter id="fogblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
 <filter id="mist" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
 <clipPath id="glassclip"><rect x="462" y="112" width="256" height="496" rx="110"/></clipPath>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<rect y="662" width="1280" height="58" fill="#DFD1C1"/>
<line x1="0" y1="662" x2="1280" y2="662" stroke="#CDBBA7" stroke-width="4"/>

<!-- mirror stand + frame -->
<g stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
 <path d="M500 630 L470 664" fill="none"/><path d="M680 630 L710 664" fill="none"/>

 <rect x="462" y="112" width="256" height="496" rx="110" fill="url(#glass)" stroke-width="6"/>
</g>

  <path d="M572 436 L584 432 M596 432 L608 436" fill="none" stroke-width="3"/>
 </g>

 <g filter="url(#mist)" fill="#FFFFFF" opacity="0.75">
  <ellipse cx="520" cy="200" rx="90" ry="60"/>
  <ellipse cx="660" cy="300" rx="80" ry="70"/>

  <ellipse cx="680" cy="520" rx="70" ry="60"/>

 </g>

 <path d="M495 170 L540 130 M500 205 L560 152" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

<!-- Om (real) -->
<g stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">

 <path d="M190 658 L165 662" fill="none"/><path d="M262 658 L288 662" fill="none"/>
 <path d="M180 382 L275 382 L318 436 L288 455 L276 432 L280 545 L176 545 L180 432 L168 455 L138 436 Z" fill="#F08C00"/>
 <!-- left arm hanging, right arm reaching to the mirror -->

 <path d="M304 445 Q370 430 428 390" fill="none"/><circle cx="436" cy="386" r="15" fill="#FAF7F2"/>

 <circle cx="214" cy="250" r="32" fill="#FFFFFF" stroke-width="6"/>

<!-- headline -->
<text id="t1" x="1010" y="300" text-anchor="middle" font-size="118" font-weight="900" fill="#1A1A1A" letter-spacing="-3">AM I</text>
<text id="t2" x="1010" y="445" text-anchor="middle" font-size="130" font-weight="900" fill="#F08C00" stroke="#1A1A1A" stroke-width="11" paint-order="stroke" stroke-linejoin="round" letter-spacing="-3">ENOUGH?</text>
</svg>
<script>
// fit ENOUGH? into the right column (x 770-1250)
document.fonts.ready.then(()=>{const t=document.getElementById('t2');let fs=130;
 while(t.getBBox().width>470&&fs>60){fs-=2;t.setAttribute('font-size',fs);} document.body.dataset.fs=fs;});
</script></body></html>
